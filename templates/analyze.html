{% extends "base.html" %}

{% block title %}Analyze Skin Image{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card">

            <div class="card-body">

                <h2 class="mb-4 text-center">
                    <i class="fas fa-microscope"></i>
                    Skin Cancer Analysis
                </h2>

                <form
                    action="{{ url_for('upload_file') }}"
                    method="POST"
                    enctype="multipart/form-data">

                    <div class="mb-4">

                        <label class="form-label">
                            Upload Skin Image
                        </label>

                        <input
                            type="file"
                            name="file"
                            class="form-control"
                            accept="image/*"
                            required>

                    </div>

                    <div class="text-center">

                        <button
                            class="btn btn-primary btn-lg">

                            <i class="fas fa-upload"></i>
                            Analyze Image

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
